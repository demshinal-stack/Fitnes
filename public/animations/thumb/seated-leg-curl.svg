/><path class="nk" d="M179.8 116.1 L177.4 106.4"/><path class="pony" d="M162.6 88.5 Q157.8 93.8 159.7 109.8 Q163.8 122.2 169.6 124.9 Q171.1 118.3 170.4 107.2 Q166.5 95.8 162.6 88.5 Z"/><path class="hd" d="M164.6 91 a10.5 10.5 0 1 0 21 0 a10.5 10.5 0 1 0 -21 0"/><path class="hd" d="M183.2 84.4 L186.8 88.1 L184.8 90.7 L185.9 93 Q185.9 97.1 184.1 98.1 L177.2 101.3 L173.8 91.9 Z"/><path class="hair" d="M180.8 82.9 Q174.3 77.3 167.1 81.7 Q160.4 88 164.3 97.3 Q169.2 102.3 173.8 100.1 Q169.9 92.8 174.3 89.7 Q178.2 84.6 180.8 82.9 Z"/><path class="tie" d="M160.2 88.5 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0"/><path class="ua" d="M179.8 116.1 L203 151.2"/><path class="fa" d="M203 151.2 L236 170"/><path class="hand" d="M231 170 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0"/><path class="pad" d="M218 177 L248 177 A7 7 0 0 0 248 163 L218 163 A7 7 0 0 0 218 177 Z"/><path class="glow" d="M207.3 201 L244.2 201 A9 9 0 0 0 244.2 183 L207.3 183 A9 9 0 0 0 207.3 201 Z"/><path class="pad" d="M278 224.9 a9 9 0 1 0 18 0 a9 9 0 1 0 -18 0"/></svg>