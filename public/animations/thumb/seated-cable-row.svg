d="M128 200 L127.3 130"/><path class="tr" d="M128 200 L127.3 130"/><path class="nk" d="M127.2 128 L127.1 118"/><path class="pony" d="M116.9 97.1 Q111 101.2 109.1 117.2 Q110.3 130.2 115.3 134.1 Q118.2 128.1 120.1 117.1 Q119 105.1 116.9 97.1 Z"/><path class="hd" d="M118 102.5 a10.5 10.5 0 1 0 21 0 a10.5 10.5 0 1 0 -21 0"/><path class="hd" d="M137.9 97.9 L140.5 102.4 L138 104.4 L138.5 106.9 Q137.6 110.9 135.6 111.4 L128.1 113 L127 103 Z"/><path class="hair" d="M135.9 95.9 Q130.8 89 122.9 91.5 Q114.9 96.1 116.5 106.1 Q120.1 112.1 125.1 111 Q123 103 128 101 Q132.9 96.9 135.9 95.9 Z"/><path class="tie" d="M114.5 97.1 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0"/><path class="ua" d="M127.2 128 L138.3 168.5"/><path class="fa" d="M138.3 168.5 L176.3 167.9"/><path class="hand" d="M171.3 167.9 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0"/><path class="glow" d="M100.2 150 a15 15 0 1 0 30 0 a15 15 0 1 0 -30 0"/><path class="grip" d="M176.3 163.9 L176.3 171.9"/></svg>