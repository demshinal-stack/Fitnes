241.5 V246.1 Q56 247.6 54.5 247.6 H23.5 Q22 247.6 22 246.1 V241.5 Q22 240 23.5 240 Z"/><path class="plate" d="M23.5 249 H54.5 Q56 249 56 250.5 V255.1 Q56 256.6 54.5 256.6 H23.5 Q22 256.6 22 255.1 V250.5 Q22 249 23.5 249 Z"/><path class="pin" d="M57 132.3 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0"/><path class="rod" d="M39 75.8 L39 109.8"/><path class="metal" d="M70 260 L300 260"/><path class="metal" d="M120 196 L120 260"/><path class="metal" d="M250 196 L262 260"/><path class="metal" d="M122 196 L128 212"/><path class="pulley" d="M33 40 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0"/><path class="cable" d="M39 75.8 L39 40 L264 40 L264 186"/><path class="metal" d="M270 190 L270 176 L282.8 126.4"/><path class="grip" d="M121 220 L135 220"/><path class="pad" d="M102 184 H258 Q264 184 264 190 V190 Q264 196 258 196 H102 Q96 196 96 190 V190 Q96 184 102 184 Z"/><path class="th" d="M214 176 L270 176"/><path class="sh" d="M270 176 L294.4 127.8"/><path class="ft-o" d="M290 125.6 L310.5 136"/><path class="ft" d="M290 125.6 L310.5 136"/><path class="glute" d="M202.9 174 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0"/><path class="tr-o" d="M214 176 L144 178.4"/><path class="tr" d="M214 176 L144 178.4"/><path class="nk" d="M142 178.5 L132.1 179.9"/><path class="pony" d="M108.9 179.7 Q110 172.6 123.6 164 Q135.8 159.4 141.6 162.3 Q137.4 167.5 128.3 174 Q117 178.1 108.9 179.7 Z"/><path class="hd" d="M108.2 187.8 a10.5 10.5 0 1 0 21 0 a10.5 10.5 0 1 0 -21 0"/><path class="hd" d="M118.7 198.3 L123.8 198.7 L124.6 195.6 L127 195 Q130.2 192.4 129.8 190.4 L128 182.9 L118.5 186.2 Z"/><path class="hair" d="M116 197.4 Q107.5 195.8 106.4 187.5 Q107.1 178.3 116.8 175.5 Q123.7 176.1 125 181.1 Q116.9 182.6 117.2 188 Q115.6 194.2 116 197.4 Z"/><path class="tie" d="M106.5 179.7 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0"/><path class="ua" d="M142 178.5 L102.3 192"/><path class="fa" d="M102.3 192 L128 220"/><path class="hand" d="M123 220 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0"/><path class="glow" d="M222 179 L264 179 A9 9 0 0 0 264 161 L