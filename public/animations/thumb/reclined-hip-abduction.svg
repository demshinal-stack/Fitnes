/><path class="pad" d="M97.8 156.4 H97.8 Q104.8 156.4 104.8 163.4 V197.4 Q104.8 204.4 97.8 204.4 H97.8 Q90.8 204.4 90.8 197.4 V163.4 Q90.8 156.4 97.8 156.4 Z"/><path class="glow" d="M166 170 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0"/><path class="pad" d="M222.2 156.4 H222.2 Q229.2 156.4 229.2 163.4 V197.4 Q229.2 204.4 222.2 204.4 H222.2 Q215.2 204.4 215.2 197.4 V163.4 Q215.2 156.4 222.2 156.4 Z"/><path class="plate act-plate" d="M310 120.4 H312 Q314 120.4 314 122.4 V164.4 Q314 166.4 312 166.4 H310 Q308 166.4 308 164.4 V122.4 Q308 120.4 310 120.4 Z"/></svg>