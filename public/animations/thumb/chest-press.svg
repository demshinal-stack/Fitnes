<svg xmlns="http://www.w3.org/2000/svg" class="gm gm-thumb" viewBox="7 2 293 293" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>/* Styles for GymMachines SVG. Monochrome black/white; lime = weight and settings, pink = working muscles; natural skin tone. */
.gm{--gm-body:#1C1C1C;--gm-accent:#111111;--gm-over:#5E7A12;--gm-blue:#C6F432;--gm-pink:#FF8FB8;--gm-metal:#BDBDBD;--gm-ink:#1C1C1C;--gm-glass:rgba(255,255,255,.62);--gm-edge:#FFFFFF;--gm-plate:#FFFFFF;
  display:block;width:100%;height:auto;font-family:"Montserrat",system-ui,sans-serif}
.gm path,.gm line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.gm{--gm-skin:#E9B596;--gm-skin-act:#F58FB4;--gm-cloth:#1E1E1E;--gm-legs:#3B3B3D;--gm-cloth-act:#E8609E;--gm-hair:#B8935F;--gm-hair-d:#7C5E36;--gm-shoe:#FFFFFF}
/* the girl: burgundy top and leggings, bare arms, white sneakers, ponytail */
.gm .tr,.gm .trf{stroke:#FFFFFF}.gm .tr-o,.gm .trf-o{stroke:#BDBDBD}.gm .tr-o{stroke-width:23.5}.gm .trf-o{stroke-width:34.5}.gm .th,.gm .sh{stroke:var(--gm-legs)}.gm .glute{fill:var(--gm-legs);stroke:none}
.gm .ua,.gm .fa,.gm .nk,.gm .shl{stroke:var(--gm-skin)}
.gm .ft{stroke:var(--gm-shoe)}.gm .ft-o{stroke:#9A9A9A;stroke-width:11}
.gm .tr{stroke-width:21}.gm .trf{stroke-width:32}.gm .shl{stroke-width:11}.gm .th{stroke-width:18}.gm .sh{stroke-width:12}.gm .ft{stroke-width:8}
.gm .ua{stroke-width:9.5}.gm .fa{stroke-width:8}.gm .nk{stroke-width:7}
.gm .hd{fill:var(--gm-skin);stroke:none}
.gm .bust{fill:#FFFFFF;stroke:#BDBDBD;stroke-width:1.2}
.gm .hair{fill:var(--gm-hair);stroke:var(--gm-hair-d);stroke-width:.6}
.gm .pony{fill:var(--gm-hair);stroke:var(--gm-hair-d);stroke-width:.8}
.gm .tie{fill:var(--gm-hair-d);stroke:none}
.gm .hand{fill:var(--gm-skin);stroke:none}
.gm .glow{fill:var(--gm-pink);opacity:.45;stroke:none}
.gm .frame{fill:#EFEFEF;stroke:#BDBDBD;stroke-width:3}
.gm .metal{stroke:var(--gm-metal);stroke-width:8}
.gm .metal-thin{stroke:var(--gm-metal);stroke-width:5}
.gm .rail{stroke:var(--gm-metal);stroke-width:8}
.gm .pad{fill:#A6A6A6;stroke:#8A8A8A;stroke-width:2}
.gm .grip{stroke:#111;stroke-width:9}
.gm .plate{fill:#2A2A2A;stroke:#5A5A5A;stroke-width:1}
.gm .act-plate{fill:var(--gm-blue);stroke:#1C1C1C}
.gm .pin{fill:var(--gm-accent);stroke:#fff;stroke-width:1.5}
.gm .rod{stroke:var(--gm-ink);stroke-width:3}
.gm .cable{stroke:var(--gm-ink);stroke-width:2.5;opacity:.75}
.gm .pulley{fill:#fff;stroke:var(--gm-metal);stroke-width:3}
.gm .wheel{fill:#fff;stroke:var(--gm-accent);stroke-width:3}
.gm .floor{stroke:var(--gm-metal);stroke-width:4;opacity:.7}
.gm .hole{fill:#fff;stroke:var(--gm-ink);stroke-width:1.5}
.gm .hole.on{fill:var(--gm-accent);stroke:var(--gm-accent)}
.gm .hole.rec{fill:var(--gm-blue);stroke:#5E7A12}
.gm .rec-mark{stroke:#8DB51C;stroke-width:4}
.gm text.lbl{font-size:11.5px;font-weight:800;fill:var(--gm-ink);letter-spacing:.01em}
.gm text.sel-lbl{fill:var(--gm-accent);font-size:13px;font-weight:900}
.gm text.rec-lbl{fill:#5E7A12;font-size:10px;font-weight:800}
.gm text.tiny{font-size:9px;font-weight:700;fill:var(--gm-ink);opacity:.85}
.gm text.tiny.on{fill:var(--gm-accent);opacity:1;font-weight:900}
.gm text.dim{font-size:8.5px;letter-spacing:.04em}
.gm text.warn{fill:var(--gm-over);font-size:10px;font-weight:900}
.gm .hit{fill:transparent;stroke:none;cursor:pointer}
.gm [data-part]{cursor:pointer}
.gm .tap{stroke:var(--gm-accent);stroke-width:2.5;stroke-dasharray:4 4}
.gm .lbl-bg{fill:#fff;stroke:var(--gm-accent);stroke-width:2}
.gm .far{opacity:.4}
.gm .bell{fill:#fff;stroke:var(--gm-ink);stroke-width:2.5}
.gm .bell.far{fill:#fff}
.gm .ball{fill:rgba(210,210,210,.6);stroke:#fff;stroke-width:3}
.gm .ball-hl{stroke:#fff;stroke-width:4;opacity:.85}
.gm .guide{stroke:#8DB51C;stroke-width:2.5;stroke-dasharray:6 5}
.gm .over-plate{fill:var(--gm-over);stroke:#C6F432}
.gm .metal-thin.sep{opacity:.4}
.gm .arrow{stroke:var(--gm-accent);stroke-width:3;fill:none;stroke-dasharray:5 4}
.gm .glow.low{opacity:.5}
/* thumbnails sit on near-white: give pads and frames a pink fill and a visible outline */
.gm-thumb .pad,.gm-thumb .frame{fill:#E6E6E6;stroke:#9A9A9A;stroke-width:3}
.gm-thumb .plate{stroke:var(--gm-metal);stroke-width:1.4}
.gm-thumb .ball{fill:#E3E3E3;stroke:#9A9A9A}
</style><path class="frame" d="M22 62 H56 Q61 62 61 67 V257 Q61 262 56 262 H22 Q17 262 17 257 V67 Q17 62 22 62 Z"/><path class="plate act-plate" d="M23.5 94.8 H54.5 Q56 94.8 56 96.3 V99.8 Q56 101.3 54.5 101.3 H23.5 Q22 101.3 22 99.8 V96.3 Q22 94.8 23.5 94.8 Z"/><path class="plate act-plate" d="M23.5 102.7 H54.5 Q56 102.7 56 104.2 V107.7 Q56 109.2 54.5 109.2 H23.5 Q22 109.2 22 107.7 V104.2 Q22 102.7 23.5 102.7 Z"/><path class="plate act-plate" d="M23.5 110.6 H54.5 Q56 110.6 56 112.1 V115.6 Q56 117.1 54.5 117.1 H23.5 Q22 117.1 22 115.6 V112.1 Q22 110.6 23.5 110.6 Z"/><path class="plate" d="M23.5 131.7 H54.5 Q56 131.7 56 133.2 V136.7 Q56 138.2 54.5 138.2 H23.5 Q22 138.2 22 136.7 V133.2 Q22 131.7 23.5 131.7 Z"/><path class="plate" d="M23.5 139.6 H54.5 Q56 139.6 56 141.1 V144.6 Q56 146.1 54.5 146.1 H23.5 Q22 146.1 22 144.6 V141.1 Q22 139.6 23.5 139.6 Z"/><path class="plate" d="M23.5 147.5 H54.5 Q56 147.5 56 149 V152.5 Q56 154 54.5 154 H23.5 Q22 154 22 152.5 V149 Q22 147.5 23.5 147.5 Z"/><path class="plate" d="M23.5 155.4 H54.5 Q56 155.4 56 156.9 V160.4 Q56 161.9 54.5 161.9 H23.5 Q22 161.9 22 160.4 V156.9 Q22 155.4 23.5 155.4 Z"/><path class="plate" d="M23.5 163.3 H54.5 Q56 163.3 56 164.8 V168.3 Q56 169.8 54.5 169.8 H23.5 Q22 169.8 22 168.3 V164.8 Q22 163.3 23.5 163.3 Z"/><path class="plate" d="M23.5 171.2 H54.5 Q56 171.2 56 172.7 V176.2 Q56 177.7 54.5 177.7 H23.5 Q22 177.7 22 176.2 V172.7 Q22 171.2 23.5 171.2 Z"/><path class="plate" d="M23.5 179.1 H54.5 Q56 179.1 56 180.6 V184 Q56 185.5 54.5 185.5 H23.5 Q22 185.5 22 184 V180.6 Q22 179.1 23.5 179.1 Z"/><path class="plate" d="M23.5 186.9 H54.5 Q56 186.9 56 188.4 V191.9 Q56 193.4 54.5 193.4 H23.5 Q22 193.4 22 191.9 V188.4 Q22 186.9 23.5 186.9 Z"/><path class="plate" d="M23.5 194.8 H54.5 Q56 194.8 56 196.3 V199.8 Q56 201.3 54.5 201.3 H23.5 Q22 201.3 22 199.8 V196.3 Q22 194.8 23.5 194.8 Z"/><path class="plate" d="M23.5 202.7 H54.5 Q56 202.7 56 204.2 V207.7 Q56 209.2 54.5 209.2 H23.5 Q22 209.2 22 207.7 V204.2 Q22 202.7 23.5 202.7 Z"/><path class="plate" d="M23.5 210.6 H54.5 Q56 210.6 56 212.1 V215.6 Q56 217.1 54.5 217.1 H23.5 Q22 217.1 22 215.6 V212.1 Q22 210.6 23.5 210.6 Z"/><path class="plate" d="M23.5 218.5 H54.5 Q56 218.5 56 220 V223.5 Q56 225 54.5 225 H23.5 Q22 225 22 223.5 V220 Q22 218.5 23.5 218.5 Z"/><path class="plate" d="M23.5 226.4 H54.5 Q56 226.4 56 227.9 V231.4 Q56 232.9 54.5 232.9 H23.5 Q22 232.9 22 231.4 V227.9 Q22 226.4 23.5 226.4 Z"/><path class="plate" d="M23.5 234.3 H54.5 Q56 234.3 56 235.8 V239.3 Q56 240.8 54.5 240.8 H23.5 Q22 240.8 22 239.3 V235.8 Q22 234.3 23.5 234.3 Z"/><path class="plate" d="M23.5 242.2 H54.5 Q56 242.2 56 243.7 V247.2 Q56 248.7 54.5 248.7 H23.5 Q22 248.7 22 247.2 V243.7 Q22 242.2 23.5 242.2 Z"/><path class="plate" d="M23.5 250.1 H54.5 Q56 250.1 56 251.6 V255.1 Q56 256.6 54.5 256.6 H23.5 Q22 256.6 22 255.1 V251.6 Q22 250.1 23.5 250.1 Z"/><path class="pin" d="M57 114.5 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0"/><path class="rod" d="M39 60.8 L39 94.8"/><path class="metal" d="M140 260 L290 260"/><path class="metal" d="M156 260 L156 34 L286 34 L286 44"/><path class="metal" d="M174 210 L174 260"/><path class="pulley" d="M33 40 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0"/><path class="cable" d="M39 60.8 L39 40 L272 40"/><path class="pulley" d="M272 44 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0"/><path class="pad" d="M179.1 203 L160.7 98.6 A8 8 0 0 0 145 101.3 L163.4 205.7 A8 8 0 0 0 179.1 203 Z"/><path class="pad" d="M152 203 H204 Q210 203 210 209 V210 Q210 216 204 216 H152 Q146 216 146 210 V209 Q146 203 152 203 Z"/><path class="metal" d="M280 44 L250.2 140.7"/><path class="th" d="M184 196 L239.7 201.9"/><path class="sh" d="M239.7 201.9 L254 254"/><path class="ft-o" d="M249.2 255.3 L271.4 249.2"/><path class="ft" d="M249.2 255.3 L271.4 249.2"/><path class="glute" d="M171 196.3 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0"/><path class="tr-o" d="M184 196 L171.8 127.1"/><path class="tr" d="M184 196 L171.8 127.1"/><path class="nk" d="M171.5 125.1 L169.8 115.2"/><path class="pony" d="M156.3 96.3 Q151.1 101.3 151.9 117.4 Q155.1 130 160.7 133.1 Q162.6 126.7 162.7 115.5 Q159.6 103.8 156.3 96.3 Z"/><path class="hd" d="M158 99.7 a10.5 10.5 0 1 0 21 0 a10.5 10.5 0 1 0 -21 0"/><path class="hd" d="M177.1 93.6 L180.4 97.6 L178.2 100 L179.2 102.4 Q178.9 106.5 177 107.4 L169.9 110.1 L167.2 100.5 Z"/><path class="hair" d="M174.8 92 Q168.7 86 161.2 89.8 Q154.1 95.7 157.3 105.3 Q161.8 110.6 166.6 108.7 Q163.2 101.2 167.8 98.3 Q172 93.5 174.8 92 Z"/><path class="tie" d="M153.9 96.3 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0"/><path class="ua" d="M171.5 125.1 L209.9 142"/><path class="fa" d="M209.9 142 L246.2 130.7"/><path class="hand" d="M241.2 130.7 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0"/><path class="glow" d="M167.5 131.1 L167.5 145.1 A8 8 0 0 0 183.5 145.1 L183.5 131.1 A8 8 0 0 0 167.5 131.1 Z"/><path class="grip" d="M246.2 126.7 L246.2 134.7"/></svg>